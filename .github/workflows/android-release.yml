name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-release:
    name: Compile & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -e
          STORE_PASS="${SIGNING_STORE_PASSWORD:-Antigravity@2026!Release}"
          KEY_PASS="${SIGNING_KEY_PASSWORD:-Antigravity@2026!Release}"
          KEY_ALIAS="${SIGNING_KEY_ALIAS:-antigravity}"

          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "Decoding release keystore from repository secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/KuatoDev.jks
          else
            echo "Generating release keystore on CI runner using keytool..."
            keytool -genkeypair -v \
              -keystore app/KuatoDev.jks \
              -alias "${KEY_ALIAS}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${STORE_PASS}" \
              -keypass "${KEY_PASS}" \
              -dname "CN=Antigravity, OU=Antigravity Android, O=AltafYafai, C=US"
          fi

          echo "SIGNING_STORE_PASSWORD=${STORE_PASS}" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=${KEY_PASS}" >> "$GITHUB_ENV"

          echo "Verifying keystore with keytool:"
          keytool -list -v -keystore app/KuatoDev.jks -storepass "${STORE_PASS}"

      - name: Compile Release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ env.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ env.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ env.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK Signature
        shell: bash
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "Error: Signed release APK not found!" >&2
            ls -la app/build/outputs/apk/release/
            exit 1
          fi
          echo "Found release APK: $APK"

          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            echo "Verifying APK signature using $APKSIGNER..."
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          else
            echo "apksigner not found, checking with unzip:"
            unzip -l "$APK" | grep -E "META-INF/.*\.(RSA|DSA|EC|SF)" || {
              echo "Error: APK does not contain signature files!" >&2
              exit 1
            }
          fi

      - name: Package Release APK & Checksum
        shell: bash
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | head -n 1)
          VERSION_NAME=$(grep -m1 'baseVersion' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.0.1"; fi
          TAG_VER="${VERSION_NAME}-${{ github.run_number }}"

          cp "$APK" dist/Antigravity-latest.apk
          cp "$APK" "dist/Antigravity-v${TAG_VER}-release.apk"
          (cd dist && sha256sum *.apk > checksums.sha256)

          PREV_TAG=$(git tag -l "v*" --sort=-creatordate | head -n 1)
          if [ -n "$PREV_TAG" ]; then
            echo "Previous tag found: $PREV_TAG"
            COMMITS=$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- **%s** (%h)")
          else
            echo "No previous tag found, taking recent commits"
            COMMITS=$(git log -n 10 --no-merges --pretty=format:"- **%s** (%h)")
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="- **Update**: Miscellaneous improvements and bug fixes"
          fi

          cat <<EOF > dist/release_notes.md
### Antigravity v${VERSION_NAME} (Build ${{ github.run_number }})

#### What's Changed
${COMMITS}

#### Verification & Downloads
- **Signed with Release Key**: V1, V2, and V3 signatures verified.
- **Direct Download**: [\`Antigravity-latest.apk\`](https://github.com/\${{ github.repository }}/releases/download/v\${TAG_VER}/Antigravity-latest.apk)
- **Versioned APK**: [\`Antigravity-v\${TAG_VER}-release.apk\`](https://github.com/\${{ github.repository }}/releases/download/v\${TAG_VER}/Antigravity-v\${TAG_VER}-release.apk)
- **Checksums**: See attached \`checksums.sha256\`
EOF

          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "TAG_VER=${TAG_VER}" >> "$GITHUB_ENV"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Signed-Release-APK
          path: dist/*
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v${{ env.TAG_VER }}"
          name: "Antigravity v${{ env.VERSION_NAME }} (Build ${{ github.run_number }})"
          body_path: dist/release_notes.md
          draft: false
          prerelease: false
          files: dist/*
